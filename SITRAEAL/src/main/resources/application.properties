spring.application.name=SITRAEAL

# 1. BASE DE DATOS LOCAL
spring.datasource.url=jdbc:mysql://localhost:3306/sitraeal?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. SERVIDOR
server.port=8061

# 3. ARCHIVOS (MULTIPART)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 4. TOMCAT
server.tomcat.max-parameter-count=10000
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB

# 5. CORREO UNIVERSAL (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tinocuadros@gmail.com
spring.mail.password=bnlbmwvmkdtwgmcd
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.transport.protocol=smtp

