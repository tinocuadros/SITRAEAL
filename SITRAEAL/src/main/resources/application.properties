spring.application.name=SITRAEAL

# Usamos variables para que Render o Docker las llenen automaticamente
spring.datasource.url=jdbc:mysql://${MYSQL_ADDON_HOST}:${MYSQL_ADDON_PORT}/${MYSQL_ADDON_DB}?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8
spring.datasource.username=${MYSQL_ADDON_USER}
spring.datasource.password=${MYSQL_ADDON_PASSWORD}

# Configuracion del puerto para Render
server.port=${PORT:10000}

# MULTIPART
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# TOMCAT
server.tomcat.max-parameter-count=10000
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB