<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Empleados | SITRAEAL</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>
    body {
        background: linear-gradient(rgba(0, 0, 0, .6), rgba(0, 0, 0, .6)),
            url('/img/fondo-home.jpg') no-repeat center center fixed;
        background-size: cover;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card {
        border: none;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
        overflow: hidden;
    }

    .card-header {
        background-color: #16633a; /* Verde Institucional */
        color: white;
        padding: 1.5rem;
    }

    .form-label {
        font-weight: 600;
        color: #34495e;
    }

    .form-control:focus, .form-select:focus {
        border-color: #16633a;
        box-shadow: 0 0 0 0.25rem rgba(22, 99, 58, 0.25);
    }

    .btn-success {
        background-color: #16633a;
        border: none;
    }

    .btn-success:hover {
        background-color: #0e4426;
    }

    .section-title {
        border-bottom: 2px solid #e9ecef;
        padding-bottom: 0.5rem;
        color: #16633a !important; /* Forzamos el color verde en títulos de sección */
    }
</style>
</head>

<body>

    <div class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-9">

                <!-- ALERTAS -->
                <div th:if="${msgSuccess}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <strong th:text="${msgSuccess}"></strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div th:if="${msgError}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <strong th:text="${msgError}"></strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- CARD -->
                <div class="card">
                    <div class="card-header text-center">
                        <img src="/img/logo.jpg" width="60" alt="Logo SITRAEAL" class="mb-2 rounded-circle shadow-sm">
                        <h3 class="mb-0">
                            <i class="bi bi-person-plus-fill"></i> Registro de Empleados
                        </h3>
                        <small class="opacity-75">Sistema de Trazabilidad para Equipos de Alturas</small>
                    </div>

                    <div class="card-body p-4">
                        <form th:action="@{/empleado/guardar}" th:object="${empleado}" method="post" enctype="multipart/form-data">

                            <!-- IDENTIFICACIÓN -->
                            <h5 class="section-title mb-3">
                                <i class="bi bi-person-badge-fill me-2"></i>Identificación
                            </h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Documento de identidad</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-card-text"></i></span>
                                        <input type="text" th:field="*{idEmpleado}" class="form-control fw-bold" placeholder="Número de documento" required>
                                    </div>
                                </div>
                            </div>

                            <!-- DATOS PERSONALES -->
                            <h5 class="section-title mb-3">
                                <i class="bi bi-person-fill me-2"></i>Datos Personales
                            </h5>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Nombres</label>
                                    <input type="text" th:field="*{nombres}" class="form-control" placeholder="Escriba los nombres" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Apellidos</label>
                                    <input type="text" th:field="*{apellidos}" class="form-control" placeholder="Escriba los apellidos" required>
                                </div>
                            </div>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Fecha de nacimiento</label>
                                    <input type="date" th:field="*{fechaNacimiento}" class="form-control">
                                </div>
                            </div>

                            <!-- CONTACTO -->
                            <h5 class="section-title mb-3">
                                <i class="bi bi-telephone-fill me-2"></i>Información de Contacto
                            </h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Teléfono</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-phone"></i></span>
                                        <input type="text" th:field="*{telefono}" class="form-control" placeholder="Ej: 3001234567" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Correo electrónico</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                        <input type="email" th:field="*{correo}" class="form-control" placeholder="ejemplo@correo.com" required>
                                    </div>
                                </div>
                            </div>

                            <!-- DIRECCIÓN -->
                            <h5 class="section-title mb-3">
                                <i class="bi bi-geo-alt-fill me-2"></i>Ubicación
                            </h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-8">
                                    <label class="form-label">Dirección de residencia</label>
                                    <input type="text" th:field="*{direccion}" class="form-control" placeholder="Calle, Carrera, Barrio..." required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Ciudad</label>
                                    <select th:field="*{ciudad.idCiudad}" class="form-select" required>
                                        <option value="">Seleccione ciudad...</option>
                                        <option th:each="c : ${ciudades}" th:value="${c.idCiudad}" th:text="${c.nombre}"></option>
                                    </select>
                                </div>
                            </div>

                            <!-- DATOS LABORALES -->
                            <h5 class="section-title mb-3">
                                <i class="bi bi-briefcase-fill me-2"></i>Datos Laborales y Certificación
                            </h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Fecha de ingreso</label>
                                    <input type="date" th:field="*{fechaIngreso}" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Certificado de curso de alturas</label>
                                    <input type="file" name="fileCertificado" class="form-control" accept=".pdf, .jpg, .jpeg, .png" required>
                                    <small class="text-muted">Adjunte el documento legal vigente (PDF o Imagen).</small>
                                </div>
                            </div>

                            <!-- BOTONES -->
                            <div class="row g-3 mt-4">
                                <div class="col-md-6">
                                    <button type="submit" class="btn btn-success w-100 py-3 shadow-sm fw-bold">
                                        <i class="bi bi-save-fill me-2"></i> REGISTRAR EMPLEADO
                                    </button>
                                </div>
                                <div class="col-md-6">
                                    <a th:href="@{/}" class="btn btn-outline-secondary w-100 py-3 fw-bold">
                                        <i class="bi bi-arrow-left-circle me-2"></i> CANCELAR / VOLVER
                                    </a>
                                </div>
                            </div>

                        </form>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <a th:href="@{/}" class="text-white text-decoration-none">
                        <i class="bi bi-house-door-fill me-1"></i> Panel Principal SITRAEAL
                    </a>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
