<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>SITRAEAL - Recuperar Contraseña</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light">
	<div class="container py-5">
		<div class="row justify-content-center">
			<div class="col-md-5">
				<div class="card shadow border-0">
					<div class="card-header bg-primary text-white text-center py-3">
						<h4 class="mb-0">¿Olvidaste tu contraseña?</h4>
					</div>
					<div class="card-body p-4">
						<p class="text-muted small">Ingresa tu correo electrónico y te
							enviaremos un enlace para restablecer tu cuenta.</p>

						<!-- Mensajes de éxito o error -->
						<div th:if="${message}" class="alert alert-success"
							th:text="${message}"></div>
						<div th:if="${error}" class="alert alert-danger"
							th:text="${error}"></div>
						<!-- Formulario para enviar correo -->
						<form th:action="@{/forgot_password}" method="post">
							<div class="mb-3">
								<label class="form-label fw-bold">Correo Electrónico</label> <input
									type="email" name="email" class="form-control" required
									placeholder="ejemplo@correo.com">
							</div>
							<button type="submit" class="btn btn-primary w-100">Enviar
								enlace</button>
						</form>
					</div>
					<div class="card-footer text-center">
						<a th:href="@{/login}"
							class="text-decoration-none small text-secondary">Volver al
							Inicio de Sesión</a>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
