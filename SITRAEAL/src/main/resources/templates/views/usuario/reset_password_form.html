<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SITRAEAL - Nueva Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-0">
                    <div class="card-header bg-success text-white text-center py-3">
                        <h4 class="mb-0">Restablecer Contraseña</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/reset_password}" method="post">
                            <input type="hidden" name="token" th:value="${token}">
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nueva Contraseña</label>
                                <input type="password" name="password" class="form-control" required minlength="6" id="pass">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Confirmar Contraseña</label>
                                <input type="password" class="form-control" required oninput="check(this)">
                            </div>
                            <button type="submit" class="btn btn-success w-100">Cambiar Contraseña</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function check(input) {
            if (input.value != document.getElementById('pass').value) {
                input.setCustomValidity('Las contraseñas no coinciden.');
            } else {
                input.setCustomValidity('');
            }
        }
    </script>
</body>
</html>
